name: Zenith CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: make install

      - name: Run automated tests
        run: make test

      - name: Build project
        run: make build

  docker:
    name: Build and push Zenith image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set repo image name
        id: image_tag
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "repo=$REPO" >> $GITHUB_OUTPUT

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.image_tag.outputs.repo }}:latest
            ghcr.io/${{ steps.image_tag.outputs.repo }}:${{ github.sha }}
            ghcr.io/${{ steps.image_tag.outputs.repo }}:sha-${{ github.sha }}
