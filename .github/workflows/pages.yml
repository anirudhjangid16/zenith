name: Deploy Zenith to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site and health endpoint
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r frontend/* dist/
          printf '{"status":"ok","service":"zenith","commit":"%s"}\n' "$GITHUB_SHA" > dist/health
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/script.js
          test -f dist/health
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to gh-pages branch as fallback
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
