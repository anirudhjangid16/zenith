name: Deploy Zenith to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site and health endpoint
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r frontend/* dist/
          printf '{"status":"ok","service":"zenith","commit":"%s"}\n' "$GITHUB_SHA" > dist/health
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/script.js
          test -f dist/health

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Configure GitHub Pages (if enabled)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload artifact (if Pages action enabled)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist

      - name: Deploy to GitHub Pages (if Pages action enabled)
        uses: actions/deploy-pages@v4
        continue-on-error: true
