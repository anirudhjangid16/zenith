apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenith-web
  labels:
    app: zenith-web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zenith-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: zenith-web
        tier: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/skit-devops-2026/devops-24eskcs046:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
